<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XCMG 备件采购到货管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a4a5f 0%, #0b2b3f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 440px;
            padding: 48px 40px;
            text-align: center;
        }
        .logo-icon { font-size: 48px; margin-bottom: 16px; }
        .logo-text { font-size: 28px; font-weight: 700; color: #1e6f5c; letter-spacing: 2px; }
        .logo-sub { font-size: 11px; color: #64748b; margin: 6px 0 24px; }
        .login-title { font-size: 22px; font-weight: 600; color: #0b2b3f; margin-bottom: 6px; }
        .login-subtitle { font-size: 13px; color: #64748b; margin-bottom: 32px; padding-bottom: 16px; border-bottom: 1px solid #e2e8f0; }
        .login-error { background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 12px; font-size: 0.8rem; margin-bottom: 20px; display: none; }
        .form-group { margin-bottom: 24px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.85rem; color: #1e4663; }
        .form-group input { width: 100%; padding: 14px 16px; border: 1px solid #e2e8f0; border-radius: 16px; font-size: 1rem; background: #f8fafc; }
        .form-group input:focus { outline: none; border-color: #1e6f5c; box-shadow: 0 0 0 3px rgba(30,111,92,0.1); background: white; }
        .btn-login { width: 100%; padding: 14px; background: #1e6f5c; color: white; border: none; border-radius: 40px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .btn-login:hover { background: #0f5a4a; transform: translateY(-2px); }
        .main-content { display: none; }
        .main-content.visible { display: block; }
        .login-page { display: flex; }
        .login-page.hidden { display: none; }
    </style>
</head>
<body>

<!-- 登录页面 -->
<div id="loginPage" class="login-page">
    <div class="login-card">
        <div class="logo-icon">🏗️</div>
        <div class="logo-text">XCMG</div>
        <div class="logo-sub">徐工集团 · 助您成功</div>
        <div class="login-title">备件采购到货管理系统</div>
        <div class="login-subtitle">Sistema de Gerenciamento de Peças</div>
        <div id="loginError" class="login-error"></div>
        <div class="form-group">
            <label>用户名 / Usuário</label>
            <input type="text" id="loginUsername" placeholder="Digite seu usuário" autocomplete="off">
        </div>
        <div class="form-group">
            <label>密码 / Senha</label>
            <input type="password" id="loginPassword" placeholder="Digite sua senha">
        </div>
        <button class="btn-login" id="loginBtn">登录 / Entrar</button>
    </div>
</div>

<!-- 主内容（简化版，登录后显示） -->
<div id="mainContent" class="main-content">
    <div style="background: white; border-radius: 24px; padding: 32px; max-width: 800px; margin: 0 auto;">
        <h1 style="color: #1e6f5c;">✅ 登录成功！</h1>
        <p style="margin-top: 16px; color: #475569;">欢迎使用 XCMG 备件采购到货管理系统</p>
        <p style="margin-top: 8px; color: #64748b;">完整版功能正在加载中，请稍候...</p>
        <button id="logoutBtn" style="margin-top: 24px; padding: 10px 24px; background: #ef4444; color: white; border: none; border-radius: 40px; cursor: pointer;">退出登录</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // Supabase 配置
    const SUPABASE_URL = 'https://mptyqhvbthiebmbhygbpxb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_OquFgVgmkDY0p9ImpD7BcQ_uwylKhmM';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function login() {
        var username = document.getElementById('loginUsername').value.trim();
        var password = document.getElementById('loginPassword').value;
        var errorDiv = document.getElementById('loginError');
        
        if (!username || !password) {
            errorDiv.innerText = '请输入用户名和密码 / Digite usuário e senha';
            errorDiv.style.display = 'block';
            return;
        }
        
        try {
            const { data, error } = await supabase
                .from('users')
                .select('*')
                .eq('username', username)
                .eq('password', password)
                .maybeSingle();
            
            if (error) {
                errorDiv.innerText = '数据库连接错误: ' + error.message;
                errorDiv.style.display = 'block';
                return;
            }
            
            if (data) {
                // 登录成功
                sessionStorage.setItem('currentUser', JSON.stringify(data));
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('mainContent').classList.add('visible');
            } else {
                errorDiv.innerText = '用户名或密码错误 / Usuário ou senha incorretos';
                errorDiv.style.display = 'block';
            }
        } catch(e) {
            errorDiv.innerText = '连接失败: ' + e.message;
            errorDiv.style.display = 'block';
        }
    }
    
    function logout() {
        sessionStorage.removeItem('currentUser');
        document.getElementById('mainContent').classList.remove('visible');
        document.getElementById('loginPage').classList.remove('hidden');
        document.getElementById('loginUsername').value = '';
        document.getElementById('loginPassword').value = '';
        document.getElementById('loginError').style.display = 'none';
    }
    
    function checkSavedLogin() {
        var saved = sessionStorage.getItem('currentUser');
        if (saved) {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainContent').classList.add('visible');
        }
    }
    
    document.getElementById('loginBtn').onclick = login;
    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('loginPassword').onkeypress = function(e) { if(e.key === 'Enter') login(); };
    
    checkSavedLogin();
</script>
</body>
</html>
